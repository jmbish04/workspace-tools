<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        <?!= options.APP_TITLE || "My App" ?>
    </title>
    <?!= include('inc_styles'); ?>
</head>

<body>
    <div id="app">
        <header class="header">
            <div class="container">
                <h1 class="app-title">
                    <?!= options.APP_TITLE || "My App" ?>
                </h1>
                <p class="app-description">
                    <?!= options.APP_DESCRIPTION || "A web application built with Google Apps Script" ?>
                </p>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <!-- Loading State -->
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>

                <!-- Main Content Area -->
                <div id="content" class="content" style="display: none;">
                    <!-- Dynamic content will be inserted here -->
                    <?!= options.MAIN_CONTENT || "<div class='card'><div class='card-body'><h3>Welcome!</h3><p>Your application content goes here.</p></div></div>" ?>
                </div>

                <!-- Error Display -->
                <div id="error" class="error" style="display: none;">
                    <div class="error-content">
                        <h3>⚠️ Error</h3>
                        <p id="error-message"></p>
                        <button onclick="retryOperation()" class="btn btn-primary">Retry</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2024 Powered by Google Apps Script</p>
            </div>
        </footer>
